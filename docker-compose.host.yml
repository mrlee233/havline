# 飞牛 NAS 等已占用 80/443 的环境：使用 host 网络 + 高位默认反代端口
# 本地项目：直接用源码构建镜像，不从 Docker Hub 拉取
name: fonu
services:
  fonu:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
        GO_IMAGE: ${GO_IMAGE:-docker.m.daocloud.io/library/golang:1.23-bookworm}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-docker.m.daocloud.io/library/debian:bookworm-slim}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: fonu:${FONU_VERSION:-local}
    container_name: fonu
    restart: unless-stopped
    network_mode: host
    volumes:
      - fonu-data:/data
    environment:
      FONU_DATA_DIR: /data
      FONU_LISTEN: :6893
      FONU_SESSION_SECRET: ${FONU_SESSION_SECRET:-change-me-in-production}
      # 时区：通知消息时间按此显示（默认东八区）
      TZ: ${TZ:-Asia/Shanghai}
      FONU_NGINX_HTTP_PORT: ${FONU_NGINX_HTTP_PORT:-18080}
      FONU_NGINX_HTTPS_PORT: ${FONU_NGINX_HTTPS_PORT:-9443}

volumes:
  fonu-data:
